<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img" aria-labelledby="title desc"><title id="title">A radial names position from the station</title><desc id="desc">A 090 radial extends east from a VOR station. An airplane on it points west toward the station; its radial is still 090.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#236384"/></marker></defs><path fill="#fff" d="M0 0H600V420H0Z"/><g font-family="Arial, sans-serif" font-size="28" fill="#293c47"><path d="M40 120V70" stroke="#293c47" stroke-width="3"/><path d="M34 80L40 68L46 80" fill="none" stroke="#293c47" stroke-width="3"/><text x="28" y="52">N</text><circle cx="120" cy="220" r="12" fill="#fff" stroke="#236384" stroke-width="3"/><path d="M132 220H510" fill="none" stroke="#236384" stroke-width="3.5" marker-end="url(#arrow)"/><path transform="translate(400 220)" d="M-34 0L-22-5H-8L8-35H15L8-5H29L36-13H42L38 0L42 13H36L29 5H8L15 35H8L-8 5H-22Z" fill="#e4e9ea" stroke="#293c47" stroke-width="2.5" stroke-linejoin="round"/><text x="92" y="280">VOR</text><text x="235" y="175" fill="#236384">R-090</text></g></svg>
