<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img" aria-labelledby="title desc"><title id="title">North of the 090 radial with 270 selected</title><desc id="desc">The same west-heading airplane is north of the 090 radial. A conventional CDI set to 270 shows TO and its needle deflected left.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#236384"/></marker></defs><path fill="#fff" d="M0 0H600V420H0Z"/><g font-family="Arial, sans-serif" font-size="28" fill="#293c47"><path d="M40 120V70" stroke="#293c47" stroke-width="3"/><path d="M34 80L40 68L46 80" fill="none" stroke="#293c47" stroke-width="3"/><text x="28" y="52">N</text><circle cx="70" cy="230" r="10" fill="#fff" stroke="#236384" stroke-width="3"/><path d="M80 230H285" fill="none" stroke="#236384" stroke-width="3.5" marker-end="url(#arrow)"/><path transform="translate(220 195)" d="M-34 0L-22-5H-8L8-35H15L8-5H29L36-13H42L38 0L42 13H36L29 5H8L15 35H8L-8 5H-22Z" fill="#e4e9ea" stroke="#293c47" stroke-width="2.5" stroke-linejoin="round"/><text x="42" y="290">VOR</text><text x="135" y="290" fill="#236384">R-090</text><circle cx="450" cy="220" r="115" fill="none" stroke="#293c47" stroke-width="3"/><path d="M450 165V285" stroke="#adb8be" stroke-width="2" stroke-dasharray="5 6"/><circle cx="390" cy="220" r="2.5" fill="#293c47"/><circle cx="402" cy="220" r="2.5" fill="#293c47"/><circle cx="414" cy="220" r="2.5" fill="#293c47"/><circle cx="426" cy="220" r="2.5" fill="#293c47"/><circle cx="438" cy="220" r="2.5" fill="#293c47"/><circle cx="450" cy="220" r="2.5" fill="#293c47"/><circle cx="462" cy="220" r="2.5" fill="#293c47"/><circle cx="474" cy="220" r="2.5" fill="#293c47"/><circle cx="486" cy="220" r="2.5" fill="#293c47"/><circle cx="498" cy="220" r="2.5" fill="#293c47"/><circle cx="510" cy="220" r="2.5" fill="#293c47"/><path d="M390 175V265" stroke="#236384" stroke-width="5"/><text x="450" y="150" text-anchor="middle">270°</