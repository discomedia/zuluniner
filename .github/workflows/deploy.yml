name: Deploy static site and MCP
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      publication_id:
        description: Content publication UUID
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: zuluniner-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PUBLICATION_ID: ${{ inputs.publication_id }}
      DEPLOYMENT_URL: https://zuluniner.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --import tsx scripts/publication-state.ts building
      - run: npm run typecheck && npm run lint && npm test
      - run: npm run build
      - run: npm run worker:check
      - run: npx wrangler deploy
      - run: node --import tsx scripts/verify-static.ts https://zuluniner.com
      - if: success()
        run: node --import tsx scripts/publication-state.ts deployed
      - if: failure()
        run: node --import tsx scripts/publication-state.ts failed
